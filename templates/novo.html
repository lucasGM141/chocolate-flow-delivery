<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Chocolate - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fdfbf7; padding: 40px; color: #333; }
        .form-box { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #3e2723; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-save { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>➕ Cadastrar Novo Chocolate</h2>
        <form action="/salvar" method="post">
            <label>Nome do Chocolate:</label>
            <input type="text" name="nome" required placeholder="Ex: Barra Meio Amargo">
            
            <label>Descrição:</label>
            <textarea name="descricao" rows="3" placeholder="Detalhes do chocolate..."></textarea>
            
            <label>Preço (R$):</label>
            <input type="number" step="0.01" name="preco" required placeholder="0.00">
            
            <label>Quantidade em Estoque:</label>
            <input type="number" name="estoque" value="10" min="0" required>
            
            <label>URL da Imagem:</label>
            <input type="url" name="imagem_url" placeholder="https://linkdaimagem.com/foto.jpg">
            
            <button type="submit" class="btn-save">Salvar Chocolate</button>
        </form>
        <a href="/" class="btn-back">Voltar para a vitrine</a>
    </div>
</body>
</html>
