{% extends 'base.html' %}

{% block conteudo %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #f1eae1;">
    <h2 style="color: #3d2314; margin-bottom: 10px; text-align: center; font-weight: 700;">Acesse sua Conta</h2>
    <p style="color: #7a6355; text-align: center; font-size: 14px; margin-bottom: 30px;">Área exclusiva para clientes acompanharem seus pedidos.</p>
    
    <form action="/login_cliente" method="POST">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #3d2314; font-weight: 600; font-size: 13px;">Seu E-mail:</label>
            <input type="email" name="email" required placeholder="seuemail@exemplo.com" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px;">
        </div>

        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 8px; color: #3d2314; font-weight: 600; font-size: 13px;">Sua Senha:</label>
            <input type="password" name="senha" required placeholder="••••••••" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px;">
        </div>

        <button type="submit" style="width: 100%; background-color: #3d2314; color: #f5e6d3; padding: 14px; border: none; border-radius: 25px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s;">Entrar na Conta</button>
        
        <p style="text-align: center; margin-top: 25px; font-size: 13px; color: #7a6355;">
            Não tem cadastro ainda? <a href="/cadastro" style="color: #dca777; font-weight: 600; text-decoration: none;">Cadastre-se agora</a>
        </p>

        <div style="margin: 30px 0 15px 0; border-top: 1px dashed #e1d7cb; position: relative; text-align: center;">
            <span style="position: absolute; top: -10px; background: white; padding: 0 10px; color: #b19887; font-size: 11px; font-weight: 600; text-transform: uppercase; left: 50%; transform: translateX(-50%);">Gerenciamento</span>
        </div>

        <div style="text-align: center;">
            <a href="/login" style="display: inline-block; background-color: #fcf8f2; color: #7a6355; padding: 10px 20px; text-decoration: none; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid #ebdccb; transition: 0.2s;">
                👑 Acessar como Administrador
            </a>
        </div>
    </form>
</div>
{% endblock %}
