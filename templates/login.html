{% extends 'base.html' %}

{% block conteudo %}
<div style="max-width: 400px; margin: 60px auto; background: #fffcf9; padding: 40px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #3d2314;">
    <div style="text-align: center; margin-bottom: 20px; font-size: 30px;">👑</div>
    <h2 style="color: #3d2314; margin-bottom: 10px; text-align: center; font-weight: 800;">Painel do Administrador</h2>
    <p style="color: #7a6355; text-align: center; font-size: 13px; margin-bottom: 30px;">Insira a chave mestre para gerenciar produtos e combos.</p>
    
    <form action="/login" method="POST">
        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 8px; color: #3d2314; font-weight: 700; font-size: 13px;">Senha Administrativa:</label>
            <input type="password" name="senha" required placeholder="Sua senha master" style="width: 100%; padding: 12px; border: 2px solid #3d2314; border-radius: 8px; outline: none; font-size: 14px; background: white;">
        </div>

        <button type="submit" style="width: 100%; background-color: #3d2314; color: #f5e6d3; padding: 14px; border: none; border-radius: 25px; font-weight: 700; font-size: 15px; cursor: pointer;">Destravar Painel</button>
        
        <p style="text-align: center; margin-top: 25px; font-size: 13px;">
            <a href="/login_cliente" style="color: #7a6355; font-weight: 600; text-decoration: none;">← Voltar para Área do Cliente</a>
        </p>
    </form>
</div>
{% endblock %}
